<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel Frame Assembly — Scroll Animation</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f1419;
            --steel: #6b7280;
            --steel-light: #9ca3af;
            --foundation: #78716c;
            --accent: #f59e0b;
            --text: #ffffff;
            --gutter: 16px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        .intro {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--gutter);
            text-align: center;
        }

        .intro h1 {
            font-size: clamp(2rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .intro h1 span {
            color: var(--accent);
        }

        .intro p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--steel-light);
            max-width: 540px;
            line-height: 1.6;
        }

        .scroll-hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            z-index: 20;
            pointer-events: none;
        }

        .scroll-hint span {
            font-size: 0.85rem;
            color: var(--steel-light);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .scroll-hint .arrow {
            width: 20px;
            height: 20px;
            border-right: 2px solid var(--accent);
            border-bottom: 2px solid var(--accent);
            transform: rotate(45deg);
            animation: bounce 1.6s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: rotate(45deg) translateY(0); opacity: 1; }
            50% { transform: rotate(45deg) translateY(6px); opacity: 0.5; }
        }

        .assembly-section {
            position: relative;
            height: 300vh;
        }

        .sticky-canvas {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--gutter);
        }

        .frame-svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            max-height: 85vh;
        }

        .frame-svg .steel-member {
            fill: url(#steelGrad);
        }

        .frame-svg .foundation-pad {
            fill: var(--foundation);
        }

        .frame-svg .brace {
            stroke: var(--accent);
            stroke-width: 5;
            fill: none;
            stroke-linecap: round;
        }

        .frame-svg .gusset {
            fill: var(--accent);
            opacity: 0.85;
        }

        .frame-svg .detail-plate {
            fill: var(--steel-light);
        }

        .frame-svg text.building-label {
            fill: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-anchor: middle;
        }

        .progress-track {
            position: fixed;
            right: var(--gutter);
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 200px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            z-index: 20;
            overflow: hidden;
        }

        .progress-fill {
            width: 100%;
            height: 0%;
            background: var(--accent);
            border-radius: 2px;
            transition: height 0.1s linear;
        }

        .progress-label {
            position: fixed;
            right: calc(var(--gutter) + 14px);
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            color: var(--steel-light);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            z-index: 20;
        }

        .outro {
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--gutter);
            text-align: center;
        }

        .outro p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--steel-light);
            max-width: 480px;
        }

        .crane-bg {
            opacity: 0.04;
        }
    </style>
</head>
<body>

<section class="intro">
    <h1>Built From the <span>Ground Up</span></h1>
    <p>Every steel frame starts with a plan. Watch a three-story structure rise — beam by beam, bolt by bolt — the way we build it.</p>
</section>

<div class="scroll-hint" id="scrollHint">
    <span>Scroll to Build</span>
    <div class="arrow"></div>
</div>

<section class="assembly-section" id="assemblySection">
    <div class="sticky-canvas">
        <svg class="frame-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="steelGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#9ca3af"/>
                    <stop offset="100%" stop-color="#6b7280"/>
                </linearGradient>
                <linearGradient id="steelGradH" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#6b7280"/>
                    <stop offset="50%" stop-color="#9ca3af"/>
                    <stop offset="100%" stop-color="#6b7280"/>
                </linearGradient>
                <clipPath id="revealUp"><rect class="clip-up" x="0" y="800" width="1200" height="800"/></clipPath>
                <clipPath id="revealRight"><rect class="clip-right" x="0" y="0" width="0" height="800"/></clipPath>
            </defs>

            <!-- Background crane silhouette -->
            <g class="crane-bg">
                <rect x="950" y="100" width="16" height="600" fill="#fff"/>
                <rect x="850" y="100" width="200" height="12" fill="#fff"/>
                <rect x="960" y="100" width="6" height="12" fill="#fff" transform="rotate(-20 960 100)"/>
                <line x1="850" y1="112" x2="950" y2="200" stroke="#fff" stroke-width="3"/>
                <line x1="966" y1="112" x2="1050" y2="200" stroke="#fff" stroke-width="3"/>
                <rect x="846" y="90" width="8" height="30" fill="#fff"/>
                <line x1="850" y1="108" x2="850" y2="700" stroke="#fff" stroke-width="2" stroke-dasharray="4 6"/>
            </g>

            <!-- === FOUNDATION === -->
            <g id="foundations" style="opacity:0">
                <rect class="foundation-pad" x="120" y="720" width="120" height="30" rx="2"/>
                <rect class="foundation-pad" x="370" y="720" width="120" height="30" rx="2"/>
                <rect class="foundation-pad" x="620" y="720" width="120" height="30" rx="2"/>
                <rect class="foundation-pad" x="870" y="720" width="120" height="30" rx="2"/>
                <!-- Ground line -->
                <line x1="80" y1="750" x2="1040" y2="750" stroke="#78716c" stroke-width="2" stroke-dasharray="8 4" opacity="0.5"/>
            </g>

            <!-- === FIRST FLOOR COLUMNS === -->
            <g id="cols1" style="opacity:0">
                <rect class="steel-member" x="160" y="520" width="28" height="200" rx="2"/>
                <rect class="steel-member" x="410" y="520" width="28" height="200" rx="2"/>
                <rect class="steel-member" x="660" y="520" width="28" height="200" rx="2"/>
                <rect class="steel-member" x="910" y="520" width="28" height="200" rx="2"/>
            </g>

            <!-- === FIRST FLOOR BEAMS === -->
            <g id="beams1" style="opacity:0">
                <rect class="steel-member" x="160" y="510" width="278" height="18" rx="2" fill="url(#steelGradH)"/>
                <rect class="steel-member" x="410" y="510" width="278" height="18" rx="2" fill="url(#steelGradH)"/>
                <rect class="steel-member" x="660" y="510" width="278" height="18" rx="2" fill="url(#steelGradH)"/>
            </g>

            <!-- === SECOND FLOOR COLUMNS === -->
            <g id="cols2" style="opacity:0">
                <rect class="steel-member" x="160" y="320" width="28" height="200" rx="2"/>
                <rect class="steel-member" x="410" y="320" width="28" height="200" rx="2"/>
                <rect class="steel-member" x="660" y="320" width="28" height="200" rx="2"/>
                <rect class="steel-member" x="910" y="320" width="28" height="200" rx="2"/>
            </g>

            <!-- === SECOND FLOOR BEAMS === -->
            <g id="beams2" style="opacity:0">
                <rect class="steel-member" x="160" y="310" width="278" height="18" rx="2" fill="url(#steelGradH)"/>
                <rect class="steel-member" x="410" y="310" width="278" height="18" rx="2" fill="url(#steelGradH)"/>
                <rect class="steel-member" x="660" y="310" width="278" height="18" rx="2" fill="url(#steelGradH)"/>
            </g>

            <!-- === THIRD FLOOR COLUMNS === -->
            <g id="cols3" style="opacity:0">
                <rect class="steel-member" x="160" y="120" width="28" height="200" rx="2"/>
                <rect class="steel-member" x="410" y="120" width="28" height="200" rx="2"/>
                <rect class="steel-member" x="660" y="120" width="28" height="200" rx="2"/>
                <rect class="steel-member" x="910" y="120" width="28" height="200" rx="2"/>
            </g>

            <!-- === ROOF BEAMS === -->
            <g id="beams3" style="opacity:0">
                <rect class="steel-member" x="160" y="110" width="278" height="18" rx="2" fill="url(#steelGradH)"/>
                <rect class="steel-member" x="410" y="110" width="278" height="18" rx="2" fill="url(#steelGradH)"/>
                <rect class="steel-member" x="660" y="110" width="278" height="18" rx="2" fill="url(#steelGradH)"/>
            </g>

            <!-- === CROSS BRACING === -->
            <g id="bracing" style="opacity:0">
                <!-- Bay 1, Floor 1 -->
                <line class="brace" x1="188" y1="528" x2="410" y2="710"/>
                <line class="brace" x1="410" y1="528" x2="188" y2="710"/>
                <!-- Bay 3, Floor 2 -->
                <line class="brace" x1="688" y1="328" x2="910" y2="510"/>
                <line class="brace" x1="910" y1="328" x2="688" y2="510"/>
                <!-- Bay 2, Floor 3 -->
                <line class="brace" x1="438" y1="128" x2="660" y2="310"/>
                <line class="brace" x1="660" y1="128" x2="438" y2="310"/>
            </g>

            <!-- === DETAIL ELEMENTS (gussets & plates) === -->
            <g id="details" style="opacity:0">
                <!-- Gusset plates at brace intersections -->
                <polygon class="gusset" points="170,520 206,520 188,500"/>
                <polygon class="gusset" points="400,520 436,520 418,500"/>
                <polygon class="gusset" points="170,718 206,718 188,738"/>
                <polygon class="gusset" points="400,718 436,718 418,738"/>

                <polygon class="gusset" points="670,320 706,320 688,300"/>
                <polygon class="gusset" points="900,320 936,320 918,300"/>
                <polygon class="gusset" points="670,518 706,518 688,538"/>
                <polygon class="gusset" points="900,518 936,518 918,538"/>

                <polygon class="gusset" points="420,120 456,120 438,100"/>
                <polygon class="gusset" points="650,120 686,120 668,100"/>
                <polygon class="gusset" points="420,318 456,318 438,338"/>
                <polygon class="gusset" points="650,318 686,318 668,338"/>

                <!-- Small connection plates at beam-column joints (selected) -->
                <rect class="detail-plate" x="184" y="508" width="8" height="24" rx="1"/>
                <rect class="detail-plate" x="406" y="508" width="8" height="24" rx="1"/>
                <rect class="detail-plate" x="656" y="508" width="8" height="24" rx="1"/>
                <rect class="detail-plate" x="906" y="508" width="8" height="24" rx="1"/>

                <rect class="detail-plate" x="184" y="308" width="8" height="24" rx="1"/>
                <rect class="detail-plate" x="406" y="308" width="8" height="24" rx="1"/>
                <rect class="detail-plate" x="656" y="308" width="8" height="24" rx="1"/>
                <rect class="detail-plate" x="906" y="308" width="8" height="24" rx="1"/>

                <rect class="detail-plate" x="184" y="108" width="8" height="24" rx="1"/>
                <rect class="detail-plate" x="406" y="108" width="8" height="24" rx="1"/>
                <rect class="detail-plate" x="656" y="108" width="8" height="24" rx="1"/>
                <rect class="detail-plate" x="906" y="108" width="8" height="24" rx="1"/>
            </g>

            <!-- === BUILDING LABEL === -->
            <g id="buildingLabel" style="opacity:0">
                <text class="building-label" x="555" y="430" font-size="36">CLARK IRON ERECTORS</text>
                <text class="building-label" x="555" y="462" font-size="14" font-weight="400" letter-spacing="0.3em" fill="#9ca3af">STRUCTURAL STEEL ERECTION</text>
            </g>
        </svg>
    </div>
</section>

<section class="outro">
    <p>Every connection matters. Every beam is placed with precision. That's the Clark Iron standard.</p>
</section>

<div class="progress-track" id="progressTrack">
    <div class="progress-fill" id="progressFill"></div>
</div>
<div class="progress-label">Assembly</div>

<script src="../lib/gsap.min.js"></script>
<script src="../lib/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const section = document.getElementById('assemblySection');
const progressFill = document.getElementById('progressFill');
const scrollHint = document.getElementById('scrollHint');
const progressTrack = document.getElementById('progressTrack');

const tl = gsap.timeline({
    scrollTrigger: {
        trigger: section,
        start: 'top top',
        end: 'bottom bottom',
        scrub: 0.8,
        onUpdate: function(self) {
            const p = Math.round(self.progress * 100);
            progressFill.style.height = p + '%';
        }
    }
});

function riseColumns(id, dur) {
    const cols = document.querySelectorAll(id + ' rect');
    cols.forEach(function(col) {
        const h = parseFloat(col.getAttribute('height'));
        const y = parseFloat(col.getAttribute('y'));
        gsap.set(col, { attr: { height: 0, y: y + h } });
    });
    tl.to(id, { opacity: 1, duration: 0.01 })
      .to(id + ' rect', {
          attr: { height: function(i) {
              return parseFloat(document.querySelectorAll(id + ' rect')[i].dataset.h);
          }, y: function(i) {
              return parseFloat(document.querySelectorAll(id + ' rect')[i].dataset.oy);
          }},
          duration: dur,
          stagger: 0.08,
          ease: 'power2.out'
      }, '<');
}

function growBeams(id, dur) {
    const beams = document.querySelectorAll(id + ' rect');
    beams.forEach(function(beam) {
        const w = parseFloat(beam.getAttribute('width'));
        const x = parseFloat(beam.getAttribute('x'));
        beam.dataset.ow = w;
        beam.dataset.ox = x;
        const cx = x + w / 2;
        gsap.set(beam, { attr: { width: 0, x: cx } });
    });
    tl.to(id, { opacity: 1, duration: 0.01 })
      .to(id + ' rect', {
          attr: { width: function(i) {
              return beams[i].dataset.ow;
          }, x: function(i) {
              return beams[i].dataset.ox;
          }},
          duration: dur,
          stagger: 0.1,
          ease: 'power3.out'
      }, '<');
}

/* Store original column dimensions before overwriting */
['#cols1','#cols2','#cols3'].forEach(function(id) {
    document.querySelectorAll(id + ' rect').forEach(function(col) {
        col.dataset.h = col.getAttribute('height');
        col.dataset.oy = col.getAttribute('y');
    });
});

/* --- TIMELINE --- */

/* 0-10%: Foundations */
tl.fromTo('#foundations',
    { opacity: 0, y: 30 },
    { opacity: 1, y: 0, duration: 1, ease: 'power2.out' }
);

/* 10-25%: First floor columns rise */
riseColumns('#cols1', 1.5);

/* 25-35%: First floor beams */
growBeams('#beams1', 1);

/* 35-45%: Second floor columns */
riseColumns('#cols2', 1.2);

/* 45-55%: Second floor beams */
growBeams('#beams2', 1);

/* 55-65%: Third floor columns */
riseColumns('#cols3', 1.2);

/* 65-75%: Roof beams */
growBeams('#beams3', 1);

/* 75-85%: Cross bracing */
(function() {
    var braces = document.querySelectorAll('#bracing line');
    braces.forEach(function(line) {
        var len = line.getTotalLength();
        gsap.set(line, { strokeDasharray: len, strokeDashoffset: len });
    });
    tl.to('#bracing', { opacity: 1, duration: 0.01 })
      .to('#bracing line', {
          strokeDashoffset: 0,
          duration: 1.2,
          stagger: 0.15,
          ease: 'power2.inOut'
      }, '<');
})();

/* 85-95%: Detail elements */
tl.to('#details', { opacity: 1, duration: 0.6, ease: 'power1.in' });
tl.fromTo('#details .gusset',
    { scale: 0, transformOrigin: '50% 100%' },
    { scale: 1, duration: 0.5, stagger: 0.04, ease: 'back.out(2)' },
    '<'
);
tl.fromTo('#details .detail-plate',
    { scaleY: 0, transformOrigin: '50% 50%' },
    { scaleY: 1, duration: 0.4, stagger: 0.03, ease: 'power2.out' },
    '<+=0.1'
);

/* 95-100%: Building label */
tl.fromTo('#buildingLabel',
    { opacity: 0, scale: 0.9, transformOrigin: '50% 50%' },
    { opacity: 1, scale: 1, duration: 0.8, ease: 'power2.out' }
);

/* --- Scroll hint fade --- */
ScrollTrigger.create({
    trigger: section,
    start: 'top 80%',
    onEnter: function() { gsap.to(scrollHint, { opacity: 0, duration: 0.4, onComplete: function() { scrollHint.style.display = 'none'; } }); },
    once: true
});

/* Show / hide progress track only during assembly */
ScrollTrigger.create({
    trigger: section,
    start: 'top bottom',
    end: 'bottom top',
    onEnter: function() { gsap.to([progressTrack, '.progress-label'], { opacity: 1, duration: 0.3 }); },
    onLeave: function() { gsap.to([progressTrack, '.progress-label'], { opacity: 0, duration: 0.3 }); },
    onEnterBack: function() { gsap.to([progressTrack, '.progress-label'], { opacity: 1, duration: 0.3 }); },
    onLeaveBack: function() { gsap.to([progressTrack, '.progress-label'], { opacity: 0, duration: 0.3 }); }
});
gsap.set([progressTrack, '.progress-label'], { opacity: 0 });
</script>
</body>
</html>
